<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel Dunton · Delivery Leader</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink:#15171c; --paper:#fbfbf9; --navy:#243b6b; --mid:#5a5e68; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .card { max-width: 560px; text-align: center; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 1.4rem;
  }
  h1 {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .loc { font-size: 1rem; color: var(--mid); margin-top: 0.6rem; }
  .rule { width: 48px; height: 2px; background: var(--navy); margin: 1.8rem auto; }
  .soon { font-size: 1.05rem; line-height: 1.6; }
  .soon strong { color: var(--navy); font-weight: 600; }
  .contact {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    color: var(--mid);
    margin-top: 1.8rem;
  }
  .contact a { color: var(--navy); text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Delivery Leader · Business &amp; Digital Transformation</p>
    <h1>Daniel Dunton</h1>
    <p class="loc">Bath, Bristol, London</p>
    <div class="rule"></div>
    <p class="soon"><strong>New site coming soon.</strong><br>In the meantime, do get in touch.</p>
    <p class="contact"><a href="mailto:hello@danieldunton.com">hello@danieldunton.com</a> · <a href="https://www.linkedin.com/in/daniel-dunton-92025310/">LinkedIn</a></p>
  </div>
</body>
</html>
